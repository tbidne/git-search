# All keys are overridden by CLI args and optional, unless otherwise
# stated.

# Default values. If the field is not given anywhere else (e.g. CLI, toml),
# then this value is used.
[repo-defaults]
# The repo name used if CLI --name is not given.
name = 'my/repo'

# Values for the 'search-defaults' command. Will run these searches sequentially
# e.g.
#
#   git-search --name nixos/nixpkgs search-commit c190319
#   git-search --name nixos/nixpkgs search-pr 510883
[[search-defaults]]
# Mandatory 'commit' or 'pr'.
cmd = 'commit'
# Mandatory String commit or int pr.
arg = 'c190319'
# Mandatory repo name
name = 'nixos/nixpkgs'
# Optional description, used in logs.
desc = 'some commit'

[[search-defaults]]
cmd = 'pr'
arg = 510883
name = 'nixos/nixpkgs'

# Repo map is a map from a repo name to various args. If the given --name
# (CLI or repo-defaults.name) matches an entry here, its values will be used,
# unless overridden by the CLI.
#
# For instance, --name org/repo will match the below entry and use its
# 'branches' field.
[[repo-map]]
# Optional key. With normal usage, the --name arg corresponds to the 'name'
# field here. However, it may be the case that we want two entries
# corresponding to the same repo name e.g. because we have identically named
# repos in different domains, or we want two configurations with different
# branch filters.
#
# The 'key' field serves to disambiguate these cases i.e. when looking up
# --name, we first attempt to match 'key'. If no entry exists, we then fall
# back to 'name'.
#
# Therefore, users who do not need multiple entries with the same 'name' can
# ignore 'key' entirely, but it is there for those who need it.
key = 'nix'
# Mandatory repo name.
name = 'nixos/nixpkgs'

# Map of names to branch filters.
branches = [ '*master', '*unstable*' ]

# Domain to use.
domain = 'github.com'

# https or ssh.
protocol = 'https'

[[repo-map]]
name = 'org/repo'
branches = [
  'origin/master',
  'origin/staging'
]

# Miscellaneous options.
[logging]

# Enables logging colors. Can be 'on' or 'off', defaults to 'on'.
log-color = 'on'

# Enables logging. Can be 'debug', 'info', 'command', or 'warn'.
log-level = 'debug'

# Miscellaneous options.
[miscellaneous]

# Always performs a clean clone. Not recommended for performance. Can be
# 'on' or 'off'.
clean = 'off'
