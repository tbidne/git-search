[repo-defaults]
name = 'my/repo'

[[search-defaults]]
cmd = 'commit'
arg = 'c190319'
name = 'org/repo'
desc = 'some desc'

[[search-defaults]]
cmd = 'pr'
arg = 510883
name = 'org/repo2'

[[repo-map]]
name = 'org/repo'
branches = [ '*master', '*unstable*' ]
domain = 'server.com'
path = '~/local/path'
protocol = 'ssh'
remote = 'upstream'

[logging]
log-color = 'off'
log-level = 'debug'

[miscellaneous]
clean = 'on'
