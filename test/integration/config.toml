[repo-defaults]
name = 'my/repo'

[[search-defaults]]
cmd = 'commit'
arg = 'c190319'
name = 'org/repo'
desc = 'some desc'

[[search-defaults]]
cmd = 'pr'
arg = 510883
name = 'org/repo2'

[[repo-map]]
name = 'org/repo'
branches = [ '*master', '*unstable*' ]
domain = 'server.com'
path = '~/local/path'
protocol = 'ssh'
remote = 'upstream'

[[repo-map]]
key = 'repo1'
name = 'org/repo_dupe'
branches = [ '*master1' ]
domain = 'server1.com'
path = '~/local/path1'
protocol = 'ssh'
remote = 'upstream1'

[[repo-map]]
key = 'repo2'
name = 'org/repo_dupe'
branches = [ '*master2' ]
domain = 'server2.com'
path = '~/local/path2'
protocol = 'ssh'
remote = 'upstream2'

[[repo-map]]
key = 'repo3'
name = 'org/repo_dupe'
branches = [ '*master3' ]
domain = 'server3.com'
protocol = 'ssh'
remote = 'upstream3'

[logging]
log-color = 'off'
log-level = 'debug'

[miscellaneous]
clean = 'on'
